# Render 部署蓝图:导入此文件可一键创建后端服务
# 使用方式:Render Dashboard → New → Blueprint → 选择仓库 → 自动识别本文件
services:
  - type: web
    name: vue-admin-platform-server
    runtime: node
    plan: free
    # 后端代码在 server 子目录,需指定 root
    rootDir: server
    # Node 22.5+ 内置 node:sqlite 模块(start 命令已带 --experimental-sqlite)
    nodeVersion: 22.5.0
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 2h
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: DB_FILE
        value: /data/vue_admin.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
