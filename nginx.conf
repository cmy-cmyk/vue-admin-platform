# nginx 配置:静态资源 + SPA 路由 + 反向代理后端 + gzip 压缩
# 用于:1) Docker 前端容器  2) 裸机部署  3) 3-4 任务复用
server {
    listen 80;
    server_name _;

    # 静态资源根目录 + SPA 入口
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩(显著减小传输体积)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # 反向代理:/api 转发到后端容器(docker-compose 网络中服务名 backend)
    # 裸机部署时把 backend:3000 改成 127.0.0.1:3000
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 Authorization 头(JWT Token)
        proxy_pass_request_headers on;
    }

    # SPA 路由:刷新任意路由都回退到 index.html(Vue Router history 模式)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存(带 hash 的文件名可永久缓存)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不缓存(确保用户拿到最新版本)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
